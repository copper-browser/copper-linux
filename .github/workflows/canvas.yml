# The canvas page lives in copper-browser/canvas-app; Linux vendors its build
# (crates/copper-app/src/canvas/resources/canvas.html, pinned in CANVAS_APP_REF; packaging/README.md).
# - pull requests touching the vendored page: it must be the pinned canvas-app build;
# - hourly (or by hand): when canvas-app main has moved, push the pinned branch canvas/take-canvas-app
#   and open or update one issue with its commit list and a link that opens the PR (the org does not
#   let Actions open pull requests).
name: Canvas
on:
  pull_request:
    paths: [crates/copper-app/src/canvas/resources/**]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/sync-canvas-bundle.sh --check --canvas-app "$(cat crates/copper-app/src/canvas/resources/CANVAS_APP_REF)"
  bump:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin canvas-app main
        id: pin
        run: |
          ref=crates/copper-app/src/canvas/resources/CANVAS_APP_REF
          old=$(cat "$ref")
          packaging/sync-canvas-bundle.sh --canvas-app main
          new=$(cat "$ref")
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push the pinned branch, open or update the issue
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.pin.outputs.old }}
          NEW: ${{ steps.pin.outputs.new }}
        run: |
          branch=canvas/take-canvas-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -qam "canvas: take canvas-app ${NEW:0:7}" -m "https://github.com/copper-browser/canvas-app/compare/${OLD:0:12}...${NEW:0:12}"
          git push -f origin "$branch"
          log=$(gh api "repos/copper-browser/canvas-app/compare/$OLD...$NEW" --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"' | head -50)
          title="Canvas: canvas-app moved on"
          body=$(printf 'canvas-app `main` is at %s; Linux pins %s. Branch `%s` pins it and vendors its `dist/canvas.html` (`packaging/sync-canvas-bundle.sh --canvas-app`). Merge after its CI (the canvas webview tests) passes.\n\n**[Open the pull request](https://github.com/%s/compare/main...%s?expand=1)**\n\n%s\n\nhttps://github.com/copper-browser/canvas-app/compare/%s...%s\n\nThis issue is updated every hour while the pin is behind; it closes when the pin catches up.\n' "${NEW:0:7}" "${OLD:0:7}" "$branch" "$GITHUB_REPOSITORY" "$branch" "$log" "${OLD:0:12}" "${NEW:0:12}")
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue edit "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Close the issue once the pin has caught up
        if: steps.pin.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in $(gh issue list --state open --search 'in:title "Canvas: canvas-app moved on"' --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Linux pins canvas-app $(cut -c1-7 crates/copper-app/src/canvas/resources/CANVAS_APP_REF), its main."
          done

name: ci

# Every push to main and every pull request: rustfmt, clippy -D warnings and
# the whole test suite on Ubuntu 24.04, x86_64 and aarch64 (native runners,
# no containers), plus clippy and tests of the shared toolkit-free crates on
# windows-latest. GUI and WebKit tests run on a headless weston (pixman
# renderer, 1440x900) with a private session D-Bus — the same setup bin/dbx
# gives the devbox. Packaging files are linted here too; the .deb and the
# Flatpak themselves are built by release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Build dependencies on Ubuntu 24.04 (README.md "Building").
  APT_BUILD_DEPS: >-
    build-essential pkg-config
    libwebkitgtk-6.0-dev libgtk-4-dev libadwaita-1-dev libsecret-1-dev
  # Test-time tools: weston + a session bus for GUI/WebKit tests; dbus-send,
  # gnome-keyring-daemon and secret-tool for the private Secret Service
  # (copper-creds sandbox, secret_service and chrome import tests); python3
  # runs the bw/op vault-CLI mocks; native PostgreSQL for the copper-cloud
  # live test (never a container).
  APT_TEST_DEPS: >-
    weston dbus-daemon dbus-bin fonts-dejavu-core
    gnome-keyring libsecret-tools python3
    postgresql postgresql-client
  # copper-cloud server for crates/copper-cloud/tests/live_server.rs: the
  # pinned public release (copper-browser/copper-cloud v0.8.1), checked
  # against its published SHA256SUMS.
  COPPER_CLOUD_VERSION: "0.8.1"
  COPPER_CLOUD_SHA256_X86_64: 344cc217a90758153963c877c65cae1db2aa39ada646fed813f61a45aada81f5
  COPPER_CLOUD_SHA256_AARCH64: e6877aa2d49e014d9f8997b8ee45f007271e11d7a70fb41a3febd58876d1d56a

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: clippy + test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086 # the package lists split on purpose
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $APT_BUILD_DEPS $APT_TEST_DEPS

      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Ubuntu 24.04 stops unprivileged user namespaces unless an AppArmor
      # profile allows them, and WebKit's bubblewrap sandbox needs one. Same
      # profile the devbox uses for target/ (and the .deb ships for
      # /usr/bin/copper); never WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS.
      - name: Let test binaries create user namespaces (AppArmor)
        run: |
          sudo tee /etc/apparmor.d/copper-ci >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile copper-ci ${GITHUB_WORKSPACE}/target/** flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r -W /etc/apparmor.d/copper-ci

      - name: Start headless weston and a session bus
        run: |
          rt="$RUNNER_TEMP/xdg"
          mkdir -p "$rt" && chmod 700 "$rt"
          export XDG_RUNTIME_DIR="$rt"
          dbus-daemon --session --address="unix:path=$rt/bus" --fork --print-pid >"$rt/dbus.pid"
          setsid nohup weston --backend=headless --renderer=pixman --socket=copper-wl \
            --width=1440 --height=900 --idle-time=0 </dev/null >"$rt/weston.log" 2>&1 &
          for _ in $(seq 1 100); do [ -S "$rt/copper-wl" ] && break; sleep 0.1; done
          [ -S "$rt/copper-wl" ] || { cat "$rt/weston.log"; exit 1; }
          {
            echo "XDG_RUNTIME_DIR=$rt"
            echo "WAYLAND_DISPLAY=copper-wl"
            echo "GDK_BACKEND=wayland"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus"
            echo "NO_AT_BRIDGE=1"
          } >>"$GITHUB_ENV"

      # crates/copper-cloud/tests/live_server.rs runs against a real server:
      # the pinned copper-cloud release on native PostgreSQL from apt, with
      # COPPER_CLOUD_REQUIRE_LIVE=1 so a missing server fails instead of
      # skipping.
      - name: copper-cloud server and native PostgreSQL (live test)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=$COPPER_CLOUD_SHA256_X86_64 ;;
            aarch64) arch=aarch64; sum=$COPPER_CLOUD_SHA256_AARCH64 ;;
            *) echo "::error::no copper-cloud build for $(uname -m)"; exit 1 ;;
          esac
          tarball="copper-cloud-${COPPER_CLOUD_VERSION}-linux-${arch}.tar.gz"
          dir="$RUNNER_TEMP/copper-cloud"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-delay 3 -o "$dir/$tarball" \
            "https://github.com/copper-browser/copper-cloud/releases/download/v${COPPER_CLOUD_VERSION}/$tarball"
          echo "$sum  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" copper-cloud
          "$dir/copper-cloud" --version

          read -r pg_version pg_cluster pg_port _ < <(pg_lsclusters -h | head -1)
          sudo pg_ctlcluster "$pg_version" "$pg_cluster" start
          pg_isready -h 127.0.0.1 -p "$pg_port" -t 30
          sudo -u postgres psql -p "$pg_port" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE copper_cloud_linux LOGIN PASSWORD 'copper_cloud_linux_test_pw'" \
            -c "CREATE DATABASE copper_cloud_linux_test OWNER copper_cloud_linux"
          {
            echo "COPPER_CLOUD_BIN=$dir/copper-cloud"
            echo "COPPER_CLOUD_TEST_DATABASE_URL=postgres://copper_cloud_linux:copper_cloud_linux_test_pw@127.0.0.1:${pg_port}/copper_cloud_linux_test"
            echo "COPPER_CLOUD_REQUIRE_LIVE=1"
          } >>"$GITHUB_ENV"

      # --no-fail-fast: one failing test binary must not hide the others.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: weston log
        if: failure()
        run: cat "$RUNNER_TEMP/xdg/weston.log" || true

  # The toolkit-free crates shared with copper-windows, on Windows itself.
  # GTK/WebKit crates are left out (they are Linux-only); the WebKitGTK test
  # targets in copper-pagejs and copper-shield print SKIPPED off Linux. The
  # copper-cloud live test skips without COPPER_CLOUD_BIN (no server or
  # PostgreSQL here) and the dev-instance test skips when the instance is
  # unreachable; neither sets a REQUIRE flag on this job.
  windows:
    name: clippy + test (windows-latest, shared crates)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: >-
          cargo clippy --locked
          -p copper-core -p copper-engine -p copper-pagejs -p copper-shield
          -p copper-creds -p copper-botpass -p copper-import -p copper-cloud -p copper-mcp -p copper-shell-core
          --all-targets -- -D warnings

      # --no-fail-fast: one failing test binary must not hide the others.
      - name: Test
        run: >-
          cargo test --locked --no-fail-fast
          -p copper-core -p copper-engine -p copper-pagejs -p copper-shield
          -p copper-creds -p copper-botpass -p copper-import -p copper-cloud -p copper-mcp -p copper-shell-core

  packaging-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            shellcheck desktop-file-utils appstream apparmor flatpak-builder \
            python3-aiohttp python3-tomlkit
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh packaging/debian/maintainer-scripts/*
          shellcheck packaging/*.sh packaging/*/*.sh
      - name: Desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/share/com.copperbrowser.Copper.desktop
          appstreamcli validate --no-net packaging/share/com.copperbrowser.Copper.metainfo.xml
      - name: AppArmor profile parses
        run: apparmor_parser -Q -K -T packaging/debian/copper.apparmor
      - name: Flatpak manifest parses (with cargo sources from Cargo.lock)
        run: |
          packaging/flatpak/vendor.sh
          flatpak-builder --show-manifest packaging/flatpak/com.copperbrowser.Copper.yml >/dev/null 2>"$RUNNER_TEMP/show.err"
          if [ -s "$RUNNER_TEMP/show.err" ]; then cat "$RUNNER_TEMP/show.err"; exit 1; fi

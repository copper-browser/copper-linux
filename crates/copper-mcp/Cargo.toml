[package]
name = "copper-mcp"
description = "Copper MCP server, tools, Jev client and stdio bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
copper-core.workspace = true
# `copper cloud pair|sso|status`: pairing with no window (copper-cloud has no
# GTK and depends on copper-core alone).
copper-cloud.workspace = true
copper-engine.workspace = true
copper-pagejs.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
png = "0.17"
jpeg-encoder = "0.6"

[dev-dependencies]
tempfile = "3"

# Windows: process creation flags for `copper --launch`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true

[package]
name = "copper-calendar"
description = "Calendar peek: Google Calendar's secret iCal addresses (calendar.json), read into the next few meetings."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No GTK here: builds for Windows as well as Linux (the CI Windows job tests it).
[dependencies]
copper-core.workspace = true
# The ICS parser, with RRULE/RDATE/EXDATE expanded by `rrule` and TZID
# zones from `chrono-tz` (the `recurrence` feature).
icalendar = { version = "0.17", default-features = false, features = ["parser", "recurrence"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# An event's DURATION (`PT45M`), with the parser icalendar itself uses.
iso8601 = "0.6"
# The calendar's id in its address (`collin%40exowatt.com`).
percent-encoding = "2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package]
name = "copper-cloud"
description = "Copper Cloud client: link, auth, sync, canvas socket."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
copper-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
url.workspace = true
# TLS: rustls with the ring provider only (no aws-lc, no system trust). Every
# connection to an instance goes through `tls::PinVerifier`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
# The canvas document (Yjs, lib0 v1) and the y-sync protocol, as the server uses.
yrs = { version = "0.28", features = ["sync"] }

# Windows: GetComputerNameExW for the default device name.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true

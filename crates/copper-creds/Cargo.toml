[package]
name = "copper-creds"
description = "Secret Service password store and Bitwarden / 1Password CLI bridges."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
regex = "1"
tokio = { workspace = true, features = ["process", "fs"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "fs", "rt-multi-thread", "macros"] }

[[test]]
name = "secret_service"
harness = false

[lints]
workspace = true

[package]
name = "copper-shell-core"
description = "Copper's browser shell without a UI toolkit: tabs, pages, sessions, downloads and the control API, generic over the engine, the main loop and the view."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No GTK, GLib, GDK or WebKit here: this crate builds for Windows
# (`cargo xwin check --target x86_64-pc-windows-msvc`) as well as Linux.
[dependencies]
base64 = "0.22"
copper-cloud.workspace = true
copper-core.workspace = true
# Passwords: the platform's secret store (Secret Service on Linux,
# Credential Manager on Windows), Bitwarden and 1Password.
copper-creds.workspace = true
# Passwords CSV in and out (`forms::csv`).
copper-import.workspace = true
# BotPass: a paired BotPass server as another password source.
copper-botpass.workspace = true
# The Calendar pin's card: calendar.json and the calendars it names.
copper-calendar.workspace = true
copper-engine.workspace = true
# Canvas: posters' crop/scale/JPEG (`copper_mcp::shot`) and the board
# page's curated calls (`copper_pagejs::canvas`).
copper-mcp.workspace = true
copper-pagejs.workspace = true
# The ad blocker's list and per-page bookkeeping.
copper-shield.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# The agent in the window (`chat`): its requests to the router, and the
# transcript's item ids.
reqwest.workspace = true
# Site icons fetched without a page (`shell::marks`): an `.ico` re-encoded as PNG.
png = "0.17"
uuid = { version = "1", features = ["v4"] }
# The control API's channels (`tokio::sync`), driven from the UI main loop
# and called from any thread; the cloud's and the passwords' own
# multi-threaded runtimes, which the UI thread never blocks on.
tokio.workspace = true

[dev-dependencies]
# Single sign-on's tests: a throwaway profile.
tempfile = "3"

[lints]
workspace = true

[package]
name = "copper-core"
description = "Copper models and atomic persistence (no GTK, no WebKit)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# float_roundtrip: Swift writes shortest-round-trip doubles; parse them back bit-exact.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

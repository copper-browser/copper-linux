<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Smooth scrolling date grid</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 14px sans-serif; }
  .spacer { height: 1400px; }
  .grid { display: grid; grid-template-columns: repeat(7, 40px); gap: 4px; padding: 8px; }
  .grid div { height: 32px; line-height: 32px; text-align: center; background: #eee; cursor: pointer; }
</style>
</head>
<body>
<div class="spacer">Above the picker</div>
<div class="grid" id="month"></div>
<div class="spacer">Below the picker</div>
<script>
  // A date-picker-like month: 35 day cells, 7 per row, each records the pick.
  var month = document.getElementById('month');
  window.picked = null;
  for (var d = 1; d <= 35; d++) {
    var cell = document.createElement('div');
    cell.id = 'd' + d;
    cell.textContent = d;
    cell.addEventListener('click', function (e) { window.picked = Number(e.currentTarget.textContent); });
    month.appendChild(cell);
  }
</script>
</body>
</html>

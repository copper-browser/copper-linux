<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copper sign-in fixture</title>
  <style>
    body { max-width: 30rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.4 system-ui, sans-serif; color: #222; }
    label { display: block; margin: .7rem 0; }
    input { box-sizing: border-box; width: 100%; padding: .45rem; font: inherit; }
    button { margin-top: .8rem; padding: .45rem 1rem; font: inherit; }
    #result { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <!-- Served from docs/fixtures (python3 -m http.server 8765): a sign-in form,
       a one-time-code step, and two custom fields, for the password managers'
       fill, TOTP and save-offer paths. Submitting "signs in": the form goes
       away (the cue Copper's save offer waits for) and the page says who. -->
  <h1>Sign in</h1>
  <form id="login" action="#" autocomplete="on">
    <label for="username">Email
      <input id="username" name="username" type="email" autocomplete="username"></label>
    <label for="password">Password
      <input id="password" name="password" type="password" autocomplete="current-password"></label>
    <button id="submit" type="submit">Sign in</button>
  </form>

  <form id="code" action="#">
    <label for="otp">One-time code
      <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"></label>
    <label for="pin">PIN
      <input id="pin" name="pin" inputmode="numeric"></label>
    <label for="account-number">Account number
      <input id="account-number" name="account-number"></label>
  </form>
  <p id="result"></p>
  <script>
    document.getElementById('login').addEventListener('submit', event => {
      event.preventDefault();
      const who = document.getElementById('username').value;
      setTimeout(() => {
        event.target.remove();
        document.getElementById('result').textContent = 'Signed in as ' + who;
      }, 100);
    });
  </script>
</body>
</html>

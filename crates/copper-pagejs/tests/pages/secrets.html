<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Copper secret-redaction fixture</title>
  <style>body { font: 16px system-ui, sans-serif; } input { display: block; margin: .5rem 0; width: 20rem; }</style>
</head>
<body>
  <!-- Secret redaction: a sign-in page that copies the password everywhere it
       can the moment it lands (a visible div, the console, a global, the
       title), plus code and card boxes a person filled. -->
  <form id="login" action="#">
    <label>Email <input id="email" type="email" name="email" autocomplete="username"></label>
    <label>Password <input id="pw" type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <div id="echo"></div>
  <label>Code <input id="otp" autocomplete="one-time-code" value="602214"></label>
  <label>Card number <input id="cc" autocomplete="cc-number" value="4000056655665556"></label>
  <label>Security code <input id="csc" autocomplete="cc-csc" value="913"></label>
  <script>
    const pw = document.getElementById('pw');
    pw.addEventListener('input', () => {
      const v = pw.value;
      if (!v) return;
      document.getElementById('echo').textContent = 'Checking ' + v;
      console.log('typed password', v);
      window.leak = { password: v, url: 'https://login.test/collect?pw=' + encodeURIComponent(v) };
    });
  </script>
</body>
</html>

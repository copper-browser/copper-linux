<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copper MCP fixture</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.4 sans-serif; }
  #drop { width: 160px; height: 60px; border: 1px dashed #888; }
  #drag { width: 120px; height: 40px; background: #eee; }
  #pane { height: 80px; overflow: auto; border: 1px solid #ccc; }
  #pane div { height: 400px; }
  .pointer { cursor: pointer; }
  #gone { display: none; }
</style>
</head>
<body>
<header><nav aria-label="Main"><a href="/home">Home</a> <a href="/docs">Docs</a></nav></header>
<main>
  <h1>Copper fixture</h1>
  <p>Plain words for the agent to read.</p>
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="A pixel" width="8" height="8">
  <form id="f" action="javascript:void 0">
    <label for="name">Your name</label>
    <input id="name" name="name" placeholder="Name">
    <input id="email" type="email" aria-label="Email address" value="a@example.test">
    <input id="search" type="search" placeholder="Search docs">
    <label><input id="agree" type="checkbox"> I agree</label>
    <label><input type="radio" name="size" value="s" checked> Small</label>
    <label><input type="radio" name="size" value="l"> Large</label>
    <select id="color" name="color">
      <option value="r">Red</option>
      <option value="g">Green</option>
      <option value="b">Blue</option>
    </select>
    <textarea id="notes" placeholder="Notes"></textarea>
    <input id="volume" type="range" min="0" max="10" value="3" aria-label="Volume">
    <button id="go" type="submit">Send</button>
    <button type="button" disabled>Disabled</button>
  </form>
  <div id="editor" contenteditable="true" aria-label="Editor"></div>
  <div role="button" tabindex="0" id="custom" aria-expanded="false">Custom control</div>
  <span class="pointer" id="clicky">Clickable span</span>
  <div id="drag" draggable="true">Drag me</div>
  <div id="drop">Drop here</div>
  <div id="pane"><div>Tall inner content</div></div>
  <ul><li>First item</li><li>Second item</li></ul>
  <div aria-hidden="true">Hidden from the tree</div>
  <div id="gone">Not displayed</div>
  <h2>Results</h2>
  <p id="out">Nothing yet</p>
</main>
<footer><small>Footer note</small></footer>
<script>
  var log = [];
  function say(t) { log.push(t); document.getElementById('out').textContent = log.join(' | '); }
  document.getElementById('go').addEventListener('click', function () { say('clicked Send'); });
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); say('submitted'); });
  document.getElementById('name').addEventListener('input', function (e) { say('input ' + e.target.value); });
  document.getElementById('name').addEventListener('change', function (e) { say('change ' + e.target.value); });
  document.getElementById('color').addEventListener('change', function (e) { say('color ' + e.target.value); });
  document.getElementById('custom').addEventListener('mouseover', function () { say('hovered'); });
  document.getElementById('clicky').addEventListener('dblclick', function () { say('double'); });
  document.getElementById('clicky').addEventListener('contextmenu', function (e) { e.preventDefault(); say('context'); });
  document.getElementById('drop').addEventListener('dragover', function (e) { e.preventDefault(); });
  document.getElementById('drop').addEventListener('drop', function (e) { e.preventDefault(); say('dropped'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') say('escape'); });
  console.log('fixture ready', { n: 1 });
  console.warn('careful');
</script>
</body>
</html>

[package]
name = "copper-pagejs"
description = "Page JavaScript ported from macOS Copper, as include_str! assets plus typed results."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The WebKitGTK harness (tests/webview.rs) is Linux-only; elsewhere the target
# only prints SKIPPED, so these never build on Windows.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk4.workspace = true
glib.workspace = true
webkit6.workspace = true

# Runs every script in a real WebKitGTK view. GTK must own the process's main
# thread, so this test brings its own main() instead of libtest's harness.
[[test]]
name = "webview"
harness = false

[lints]
workspace = true
